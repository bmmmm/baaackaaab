# Build + test on GitHub's macOS runners. This covers the headless surface only
# (see Package.swift's test-target note): the TTY TUI, live Photos/TCC and
# launchd stay operator-verified on real hardware. The integration tests run
# live restic against throwaway local repos, so the runner needs the restic
# binary but no network store.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Matrix: newest + oldest still-hosted macOS. Package.swift declares
    # macOS 13 as the deployment floor, but GitHub retired the macos-13
    # runners — macos-14 is the closest hosted check that a newer-SDK API
    # doesn't silently break the older-OS claim.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install restic
        run: brew install restic
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
        env:
          RESTIC_CACHE_DIR: ${{ runner.temp }}/restic-cache
      # The TTY merge-gate: drives the real command-center TUI on a pty via
      # expect (ships with macOS) — screens, SIGWINCH redraw, clean exit.
      # Runs against an isolated throwaway store; read-only towards the
      # runner's (empty) LaunchAgents.
      - name: TUI smoke (pty)
        run: scripts/tui-smoke.sh .build/release/baaackaaab
